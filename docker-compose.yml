x-logging: &default-logging
  driver: json-file
  options:
    max-size: "${DOCKER_LOG_MAX_SIZE:-10m}"
    max-file: "${DOCKER_LOG_MAX_FILES:-5}"

services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    container_name: mosquitto-broker
    # Avoid the image's root entrypoint taking ownership of tracked bind-mount
    # files. UID 1883 owns runtime secrets; GID 1000 can read project config.
    user: "${MOSQUITTO_UID:-1883}:${APP_GID:-1000}"
    restart: unless-stopped
    ports:
      - "${MQTT_EXTERNAL_PORT:-1883}:1883"
      - "${MQTTS_EXTERNAL_PORT:-8883}:8883"
    volumes:
      - ./mosquitto/config:/mosquitto/config
      - ./mosquitto/data:/mosquitto/data
    networks:
      - bms_network
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "mosquitto_sub",
          "-h",
          "localhost",
          "-t",
          "$$SYS/broker/uptime",
          "-C",
          "1",
          "-W",
          "5",
          "-u",
          "${MQTT_USERNAME:-admin}",
          "-P",
          "${MQTT_PASSWORD:-password1234}",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bms-logger:
    build:
      context: .
      dockerfile: Dockerfile.logger
    container_name: bms-mqtt-logger
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      MQTT_BROKER: ${MQTT_BROKER:-mosquitto}
      MQTT_PORT: ${MQTT_PORT:-1883}
      MQTT_USERNAME: ${MQTT_USERNAME:-}
      MQTT_PASSWORD: ${MQTT_PASSWORD:-}
      MQTT_TOPIC: ${MQTT_TOPIC:-bms/telemetry/+}
      MQTT_STATUS_TOPIC: ${MQTT_STATUS_TOPIC:-bms/status/+}
      MQTT_AVAILABILITY_TOPIC: ${MQTT_AVAILABILITY_TOPIC:-bms/availability/+}
      DATABASE_PATH: /app/data/bms_telemetry.db
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Alert when a device has sent nothing for this long. Telemetry normally
      # arrives every ~10s and the broker keepalive is 120s.
      TELEMETRY_STALE_AFTER_SECONDS: ${TELEMETRY_STALE_AFTER_SECONDS:-900}
      MONITOR_INTERVAL_SECONDS: ${MONITOR_INTERVAL_SECONDS:-60}
    volumes:
      - .:/app/data
    networks:
      - bms_network
    logging: *default-logging
    depends_on:
      - bms-dashboard
      - mosquitto
    # Asserts broker connectivity, not database reachability: opening SQLite
    # succeeds even when the MQTT link is dead.
    healthcheck:
      test: ["CMD", "python", "/app/tools/logger_healthcheck.py"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  bms-dashboard:
    build:
      context: .
      dockerfile: Dockerfile.dashboard
    container_name: bms-dashboard
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      DATABASE_PATH: /app/data/bms_telemetry.db
      FLASK_HOST: 0.0.0.0
      FLASK_PORT: 5000
      FLASK_DEBUG: ${FLASK_DEBUG:-false}
      FLASK_SECRET_KEY: ${FLASK_SECRET_KEY:-}
    ports:
      - "${DASHBOARD_PORT:-5000}:5000"
    volumes:
      - .:/app/data
    networks:
      - bms_network
    logging: *default-logging
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "from urllib.request import urlopen; urlopen('http://localhost:5000/api/health', timeout=5).read()",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

networks:
  bms_network:
    driver: bridge
