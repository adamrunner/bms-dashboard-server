<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BMS Telemetry Dashboard</title>
    
    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
    
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="{{ url_for('static', filename='css/style.css') }}" rel="stylesheet">

    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns"></script>
    
    <!-- Socket.IO -->
    <script src="https://cdn.socket.io/4.7.2/socket.io.min.js"></script>
    
</head>
<body>
    <!-- Connection Status -->
    <div class="connection-status">
        <span id="connectionStatus" class="badge status-disconnected">Disconnected</span>
    </div>

    <!-- Navigation -->
    <nav class="navbar navbar-dark bg-primary">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">⚡ BMS Telemetry Dashboard</span>
            <div class="navbar-text">
                <span id="lastUpdate" class="text-light">Loading...</span>
            </div>
        </div>
    </nav>

    <div class="container-fluid mt-4">
        <!-- Controls -->
        <div class="row mb-4">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">BMS Selection</h5>
                        <div class="form-group">
                            <label for="bmsIdSelect" class="form-label">Select BMS:</label>
                            <select class="form-select" id="bmsIdSelect" onchange="onBmsIdChange()">
                            </select>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Time Range</h5>
                        <div class="btn-group" role="group">
                            <button type="button" class="btn btn-outline-primary active" onclick="setTimeRange(0.017)">1 Min</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setTimeRange(0.167)">10 Min</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setTimeRange(0.5)">30 Min</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setTimeRange(1)">1 Hour</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setTimeRange(6)">6 Hours</button>
                            <button type="button" class="btn btn-outline-primary" onclick="setTimeRange(24)">24 Hours</button>
                        </div>
                    </div>
                </div>
            </div>
            <div class="col-md-4">
                <div class="card">
                    <div class="card-body">
                        <h5 class="card-title">Auto Refresh</h5>
                        <div class="form-check form-switch">
                            <input class="form-check-input" type="checkbox" id="autoRefresh" checked>
                            <label class="form-check-label" for="autoRefresh">
                                Real-time Updates
                            </label>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Current Status Cards -->
        <div class="row mb-4">
            <div class="col-md-3">
                <div class="metric-card text-center">
                    <div class="metric-value" id="currentVoltage">--</div>
                    <div class="metric-label">Pack Voltage (V)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card text-center">
                    <div class="metric-value" id="currentCurrent">--</div>
                    <div class="metric-label">Current (A)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card text-center">
                    <div class="metric-value" id="currentSoC">--</div>
                    <div class="metric-label">State of Charge (%)</div>
                </div>
            </div>
            <div class="col-md-3">
                <div class="metric-card text-center">
                    <div class="metric-value" id="currentPower">--</div>
                    <div class="metric-label">Power (W)</div>
                </div>
            </div>
        </div>

        <!-- Charts -->
        <div class="row">
            <!-- Pack Voltage and Current -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Pack Voltage & Current</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="packChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- State of Charge -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">State of Charge</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="socChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Cell Voltages -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Individual Cell Voltages</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="cellChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Temperature -->
            <div class="col-lg-6">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Temperature Monitoring</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="tempChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>

            <!-- Power Consumption -->
            <div class="col-lg-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Power Consumption</h5>
                    </div>
                    <div class="card-body">
                        <div class="chart-container">
                            <canvas id="powerChart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- Statistics -->
        <div class="row mt-4">
            <div class="col-12">
                <div class="card">
                    <div class="card-header">
                        <h5 class="card-title mb-0">Statistics (Last 24 Hours)</h5>
                    </div>
                    <div class="card-body">
                        <div class="row" id="statisticsRow">
                            <!-- Statistics will be populated by JavaScript -->
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- Custom JavaScript -->
    <script src="{{ url_for('static', filename='js/dashboard.js') }}"></script>
</body>
</html>
