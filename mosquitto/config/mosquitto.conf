# Persistence configuration
persistence true
persistence_location /mosquitto/data/

# Log to the container runtime; Compose bounds and rotates the json-file logs.
log_dest stdout
connection_messages true
log_type error
log_type warning
log_type notice
log_type information

# Authenticated internal/LAN listener. Only MQTTS 8883 is forwarded by UniFi.
listener 1883 0.0.0.0
protocol mqtt
password_file /mosquitto/config/passwords/password_file
acl_file /mosquitto/config/acl
allow_anonymous false

# Runtime TLS configuration is installed only after a certificate exists.
# Mosquitto loads *.conf in lexical order and ignores the tracked .gitkeep.
include_dir /mosquitto/config/runtime.d
